[project]
name = "python-trigger-engine"
version = "0.1.0"
description = "A Python project"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7.0",
    "google-genai>=0.1,<1.0",
    "gunicorn>=21.0,<23.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn>=0.22,<1.0",
    "instaloader>=4.14,<5.0",
    "curl-cffi>=0.7,<1.0",
    "parsel>=1.9,<2.0",
    "yt-dlp>=2024.3.10",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trigger_engine"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "import-outside-toplevel",
    "unused-import",
    "no-member",
    "invalid-name",
    "self-assigning-variable",
    "protected-access",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-django>=4.12.0,<5.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "responses>=0.26.0,<0.27.0",
    "flake8>=7.3.0,<8.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[tool.isort]
known_first_party = ["trigger_engine"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["trigger_engine"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "trigger_engine.settings.local"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--nomigrations --cov=src/trigger_engine/core --cov-report=html"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "tests/*",
    "src/trigger_engine/manage.py",
    "src/trigger_engine/settings/*",
]
